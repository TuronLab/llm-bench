# Template Dockerfile-fragment / notes for adding a brand-new provider type
# to the framework's Docker architecture. Provider containers are launched
# dynamically by the backend (see providers/docker_runtime.py) rather than
# declared as static docker-compose services, but if your provider needs a
# custom image, build it here and reference it from your provider's
# `options.image` default.
#
# Steps to add a new provider end-to-end:
#   1. (Optional) Add docker/providers/<name>.Dockerfile if you need a
#      custom image; otherwise reference a public image directly.
#   2. Implement providers/<name>_provider.py (subclass providers.base.Provider).
#   3. Register it in providers/registry.py.
#   4. Add its config schema to backend/app/api/routes/providers.py
#      (PROVIDER_CONFIG_SCHEMAS) so the web UI renders the right fields.
#   5. Add a template at configs/providers/<name>.yaml.
#   6. If it can only serve one model per instance, add its type to
#      SINGLE_MODEL_PROVIDER_TYPES in backend/app/services/experiment_service.py
#      and map its "which model" option key in _MODEL_OPTION_KEY.
#
# Example custom image fragment (copy to docker/providers/<name>.Dockerfile):
#
# FROM some/base-inference-image:latest
# COPY docker/providers/<name>-entrypoint.sh /entrypoint.sh
# ENTRYPOINT ["/entrypoint.sh"]
