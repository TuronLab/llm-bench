
# Docker Compose orchestration for the LLM Benchmarking Framework.
#
# Services:
#   backend  - REST API + orchestration engine (also runs lm-evaluation-harness
#              and manages provider containers via the Docker socket).
#   frontend - Web dashboard / experiment builder / live monitoring UI.
#   cli      - One-shot `bench` CLI container (`docker compose run --rm cli ...`).
#
# Provider containers (vLLM, Ollama, llama.cpp) are launched and destroyed
# automatically by the backend at runtime -- they are NOT declared as
# long-running services here, in line with "launch on demand, tear down
# after use" from the project requirements. They still run on the same
# Docker daemon/network so the backend can reach them.
#
# Only ./experiments, ./results, and (optionally) ./logs are bind-mounted
# from the host; everything else (Python packages, model downloads, caches,
# venvs) lives entirely inside container filesystems and volumes.

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    image: benchlab-backend:latest
    container_name: benchlab-backend
    ports:
      - "8000:8000"
    environment:
      BENCHLAB_ROOT: /app
      BENCHLAB_EXPERIMENTS_DIR: /app/experiments
      BENCHLAB_RESULTS_DIR: /app/results
      BENCHLAB_LOGS_DIR: /app/logs
      BENCHLAB_CORS_ORIGINS: "*"
      BENCHLAB_LOG_LEVEL: INFO
    volumes:
      # Persistent, host-visible data -- the only things that survive
      # outside of Docker.
      - ./experiments:/app/experiments
      - ./results:/app/results
      - ./logs:/app/logs
      # Docker socket so the backend can launch/stop provider containers.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - benchlab
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    image: benchlab-frontend:latest
    container_name: benchlab-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - benchlab
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: infrastructure/docker/cli.Dockerfile
    image: benchlab-cli:latest
    container_name: benchlab-cli
    environment:
      BENCHLAB_API_URL: http://backend:8000/api/v1
      BENCHLAB_WEB_URL: http://localhost:3000
    volumes:
      - ./experiments:/app/experiments
    depends_on:
      - backend
    networks:
      - benchlab
    # This service is meant to be invoked on-demand, e.g.:
    #   docker compose run --rm cli experiment run experiments/examples/quickstart.yaml
    # so it doesn't need to stay running as part of `docker compose up`.
    profiles:
      - cli

networks:
  benchlab:
    name: benchlab-network
    driver: bridge
