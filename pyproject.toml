[project]
name = "llm-benchmarking-framework"
version = "0.0.1"
description = "Docker-native framework for benchmarking LLMs across multiple inference providers using lm-evaluation-harness."
requires-python = ">=3.11"
authors = [{ name = "Pablo Turón" }]
maintainers = [{ name = "Pablo Turón" }]
dependencies = [
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "pyyaml==6.0.2",
    "rich==13.8.1",
    "typer==0.12.5",
]

[project.scripts]
llm-bench = "apps.cli.main:app"

[dependency-groups]
api = [
    "docker==7.1.0",
    "fastapi==0.115.0",
    "lm-eval==0.4.5",
    "torch",
    "uvicorn[standard]==0.30.6",
]
dev = [
    "pytest==8.3.3",
]

# lm-eval depends on PyTorch.  PyPI's Linux wheels now include the CUDA runtime
# dependencies, which adds several GB to an otherwise CPU-only installation.
# Keep the default backend small and portable; users who need GPU execution run
# vLLM in its own provider image and can opt into its NVIDIA runtime there.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core", "infrastructure"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
