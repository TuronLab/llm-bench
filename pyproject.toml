[project]
name = "llm-benchmarking-framework"
version = "0.0.1"
description = "Docker-native framework for benchmarking LLMs across multiple inference providers using lm-evaluation-harness."
requires-python = ">=3.11"
authors = [{ name = "Pablo Turón" }]
maintainers = [{ name = "Pablo Turón" }]
dependencies = [
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "pyyaml==6.0.2",
]

[dependency-groups]
api = [
    "docker==7.1.0",
    "fastapi==0.115.0",
    "lm-eval==0.4.5",
    "uvicorn[standard]==0.30.6",
]
cli = [
    "rich==13.8.1",
    "typer==0.12.5",
]
dev = [
    "pytest==8.3.3",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
